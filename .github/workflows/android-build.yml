name: Android build check
# Runs only when started by hand or when the fix branch is pushed.
on:
  workflow_dispatch:
  push:
    branches: [fix/play-target-api-36]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: flutter pub get
      - run: flutter build apk --debug
      - run: flutter build appbundle --release
      - name: Show target SDK of the release bundle manifest
        run: grep -rh "targetSdkVersion" build/app/intermediates/merged_manifests/release || true
      - uses: actions/upload-artifact@v4
        with:
          name: bmihealthy-build-check
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/bundle/release/app-release.aab
      - name: Publish encrypted outputs (ci-out-build)
        if: always()
        run: |
          mkdir -p /tmp/o
          tar czf /tmp/o/payload.tgz build/app/outputs/bundle/release/app-release.aab 2>/dev/null || true
          openssl rand -hex 32 > /tmp/o/k
          openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/o/payload.tgz -out /tmp/o/payload.enc -pass file:/tmp/o/k
          openssl pkeyutl -encrypt -pubin -inkey ci/ci_pub.pem -in /tmp/o/k -out /tmp/o/key.enc -pkeyopt rsa_padding_mode:oaep
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-out-build
          git rm -rf -q . || true
          cp /tmp/o/payload.enc /tmp/o/key.enc .
          git add payload.enc key.enc
          git commit -q -m "encrypted outputs for ${GITHUB_SHA}"
          git push -f origin ci-out-build
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator run of the History screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: bash scripts/run_it.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-screenshots
          path: |
            shots/
            it.log
      - name: Publish encrypted outputs (ci-out-runtime)
        if: always()
        run: |
          mkdir -p /tmp/o
          tar czf /tmp/o/payload.tgz shots it.log 2>/dev/null || true
          openssl rand -hex 32 > /tmp/o/k
          openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/o/payload.tgz -out /tmp/o/payload.enc -pass file:/tmp/o/k
          openssl pkeyutl -encrypt -pubin -inkey ci/ci_pub.pem -in /tmp/o/k -out /tmp/o/key.enc -pkeyopt rsa_padding_mode:oaep
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-out-runtime
          git rm -rf -q . || true
          cp /tmp/o/payload.enc /tmp/o/key.enc .
          git add payload.enc key.enc
          git commit -q -m "encrypted outputs for ${GITHUB_SHA}"
          git push -f origin ci-out-runtime
